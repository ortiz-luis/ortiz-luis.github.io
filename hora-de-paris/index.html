<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a2b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Hora de París"><title>Hora de París</title><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}html,body{margin:0;background:#101a2b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}main{text-align:center;width:100%;max-width:680px}.flag{display:flex;width:66px;height:44px;margin:0 auto 34px;border-radius:6px;overflow:hidden}.flag i{flex:1;background:#163b83}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#db364b}h1{font-size:clamp(28px,8vw,50px);letter-spacing:.12em;margin:0 0 12px;font-weight:600}time{display:block;font-size:clamp(64px,23vw,154px);line-height:1.12;font-variant-numeric:tabular-nums;letter-spacing:-.045em;font-weight:650;white-space:nowrap}.date{font-size:clamp(19px,5.8vw,32px);margin:24px 0 0;text-transform:capitalize;color:#e5eaf0}.hint{font-size:18px;color:#b5c3d4;margin:14px 0 0}
</style></head><body><main><div class="flag" aria-label="Francia"><i></i><i></i><i></i></div><h1>PARÍS</h1><time id="clock">--:--</time><p id="date" class="date"></p><p class="hint">Hora de Francia</p><noscript>Activa JavaScript para ver la hora.</noscript></main><script>
const zone='Europe/Paris';
const clockFormat=new Intl.DateTimeFormat('es-CL',{timeZone:zone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const dateFormat=new Intl.DateTimeFormat('es-CL',{timeZone:zone,weekday:'long',day:'numeric',month:'long'});
function update(){const now=new Date();document.getElementById('clock').textContent=clockFormat.format(now);document.getElementById('date').textContent=dateFormat.format(now);}
update();setInterval(update,1000);document.addEventListener('visibilitychange',update);window.addEventListener('pageshow',update);
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
